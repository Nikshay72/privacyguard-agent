<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PrivacyGuard Demo - Application</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        .field { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <nav>
        <a href="login.html">Login</a>
        <a href="application.html">Job Application</a>
        <a href="payment.html">Payment</a>
    </nav>
    <div class="card">
        <h1>Submit Application</h1>
        <p>Please review your auto-filled details before submitting.</p>
        <form id="application-form">
            <div class="field">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" value="Alice Smith">
            </div>
            <div class="field">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" value="+1 (555) 123-4567">
            </div>
            <div class="field">
                <label for="address">Home Address</label>
                <textarea id="address" name="address" rows="2">123 Privacy Lane, Apt 4B
San Francisco, CA 94107</textarea>
            </div>
            <div class="field">
                <label for="ssn">Social Security Number</label>
                <input type="text" id="ssn" name="ssn" value="000-11-2222">
            </div>
            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
